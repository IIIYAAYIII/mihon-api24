name: Build Mihon API 24 (arm64)

on:
  workflow_dispatch:
    inputs:
      dist:
        description: 'Distribution type'
        required: false
        default: 'ci'
        type: choice
        options:
          - ci
          - local
      create_release:
        description: 'Publish to GitHub Releases page'
        required: false
        default: true
        type: boolean
      tag_name:
        description: 'Release tag name'
        required: false
        default: 'v24.0'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build arm64 APK for Android 7+ (API 24)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build arm64 Release APK
        run: ./gradlew assembleRelease -Pdist=${{ inputs.dist || 'ci' }} -Pinclude-telemetry=false

      - name: Show APK Size
        run: |
          ls -lh app/build/outputs/apk/release/

      - name: Prepare APKs
        run: |
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk mihon-${{ inputs.tag_name || 'v24.0' }}-arm64-v8a.apk

      - name: Upload arm64 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mihon-api24-arm64-v8a
          path: |
            mihon-${{ inputs.tag_name || 'v24.0' }}-arm64-v8a.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: ${{ inputs.create_release != false }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || 'v24.0' }}
          name: Mihon API 24 (${{ inputs.tag_name || 'v24.0' }})
          body: |
            ### Mihon 24.0 - Android 7.0+ (API 24) arm64-v8a

            - **支持系统 (OS)**: Android 7.0+ (API 24 及以上)
            - **CPU 架构 (ABI)**: `arm64-v8a`
            - **版本号 (Version)**: 24.0
            - **说明**: 适配 Android 7.0 的专用版本，精简了桌面小部件，图源插件默认使用私有安装器。
            - **更新内容**:
              - 修复 Keiyoushi 图源插件最低版本 (minSdkVersion 26) 无法安装的问题。
              - 深度 APK 体积瘦身（移除 native 调试符号、精简无用语言包、排除 telemetry 遥测）。
              - 修复 Android 7.0 桌面启动器图标偏小的问题，生成满幅标准尺寸矢量/光栅图标。
          files: |
            mihon-${{ inputs.tag_name || 'v24.0' }}-arm64-v8a.apk
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
